name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version-file: warp/go.mod
          cache-dependency-path: warp/go.sum

      # The runner already has an Android SDK; make sure the pieces build.sh uses are there
      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;35.0.0" > /dev/null

      - name: Build the WARP helper
        run: warp/build.sh

      - name: Build
        run: ./build.sh

      - name: Verify both APKs
        run: scripts/verify-apks.sh

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: AnantPlay-*.apk
          if-no-files-found: error
